<mat-card>

  <mat-card-header>

    <mat-card-title>

      إدارة الموظفين

    </mat-card-title>

  </mat-card-header>

  <mat-card-content>

    @if (isLoading)
    {
      <div class="loading-container">

        <mat-spinner></mat-spinner>

      </div>
    }

    @else
    {
      <button
        mat-raised-button
        type="button"
        (click)="openCreateDialog()">

        إضافة موظف

      </button>

      <br>
      <br>

      <table
        mat-table
        [dataSource]="employees">

        <ng-container matColumnDef="employeeNumber">

          <th mat-header-cell *matHeaderCellDef>

            رقم الموظف

          </th>

          <td mat-cell *matCellDef="let employee">

            {{ employee.employeeNumber }}

          </td>

        </ng-container>

        <ng-container matColumnDef="employeeName">

          <th mat-header-cell *matHeaderCellDef>

            الاسم

          </th>

          <td mat-cell *matCellDef="let employee">

            {{ employee.employeeName }}

          </td>

        </ng-container>

        <ng-container matColumnDef="qualification">

          <th mat-header-cell *matHeaderCellDef>

            المؤهل

          </th>

          <td mat-cell *matCellDef="let employee">

            {{
              getQualificationName(
                employee.qualification)
            }}

          </td>

        </ng-container>

        <ng-container matColumnDef="totalVacationDays">

          <th mat-header-cell *matHeaderCellDef>

            أيام الإجازات

          </th>

          <td mat-cell *matCellDef="let employee">

            {{ employee.totalVacationDays }}

          </td>

        </ng-container>

        <ng-container matColumnDef="actions">

          <th mat-header-cell *matHeaderCellDef>

            العمليات

          </th>

          <td mat-cell *matCellDef="let employee">

            <button
              mat-icon-button>

              <mat-icon>

                edit

              </mat-icon>

            </button>

            <button
              mat-icon-button>

              <mat-icon>

                delete

              </mat-icon>

            </button>

          </td>

        </ng-container>

        <tr
          mat-header-row
          *matHeaderRowDef="displayedColumns">
        </tr>

        <tr
          mat-row
          *matRowDef="
            let row;
            columns: displayedColumns">
        </tr>

      </table>

      <mat-paginator
        [length]="totalCount"
        [pageSize]="pageSize"
        [pageIndex]="pageNumber - 1"
        [pageSizeOptions]="[5,10,20]"
        (page)="onPageChanged($event)">
      </mat-paginator>

    }

  </mat-card-content>

</mat-card>

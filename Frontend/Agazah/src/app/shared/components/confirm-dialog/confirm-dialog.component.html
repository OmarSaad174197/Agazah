<h2 mat-dialog-title>
  {{ data.title }}
</h2>


<mat-dialog-content>

  <div class="confirmation-content">

    <mat-icon
      aria-hidden="true">
      warning
    </mat-icon>

    <p>
      {{ data.message }}
    </p>

  </div>

</mat-dialog-content>


<mat-dialog-actions align="end">

  <button
    mat-button
    type="button"
    (click)="cancel()">

    {{ data.cancelText ?? 'إلغاء' }}

  </button>


  <button
    mat-raised-button
    type="button"
    (click)="confirm()">

    {{ data.confirmText ?? 'تأكيد' }}

  </button>

</mat-dialog-actions>
